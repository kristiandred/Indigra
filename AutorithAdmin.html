<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход для администратора - ИНДИГРА</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="css/custom.css" />
    <link rel="stylesheet" href="css/common.css" />
    <style>
        /* Стили для страницы авторизации */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            transform: none !important;
        }

        .auth-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            transform: none !important;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h2 {
            color: #1e3a8a;
            font-weight: 700;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }

        .auth-header p {
            color: #6c757d;
            font-size: 1rem;
        }

        .auth-form .form-group {
            margin-bottom: 1.5rem;
        }

        .auth-form label {
            color: #1e3a8a;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
            font-size: 1rem;
        }

        .auth-form .form-control {
            border: 2px solid #dbeafe;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
            background: #ffffff;
            font-size: 1rem;
            width: 100%;
        }

        .auth-form .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.25);
            outline: none;
        }

        .auth-form .btn-auth {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 10px;
            width: 100%;
            border: none;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 1.1rem;
            margin-top: 1rem;
        }

        .auth-form .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
        }

        .auth-footer a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
        }

        .auth-footer a:hover {
            color: #1e3a8a;
            text-decoration: underline;
        }

        .error-message {
            background-color: #fee;
            color: #c33;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
            border: 1px solid #fcc;
            display: none;
            font-size: 1rem;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
            border: 1px solid #a5d6a7;
            display: none;
            font-size: 1rem;
        }

        .success-message.show {
            display: block;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #9ca3af;
            user-select: none;
            font-size: 1.2rem;
        }

        .toggle-password:hover {
            color: #1e3a8a;
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin: 1rem 0;
        }

        .remember-me input {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: #1e3a8a;
        }

        .remember-me label {
            color: #4a5568;
            font-weight: 500;
            cursor: pointer;
            margin: 0;
            font-size: 0.95rem;
        }

        /* Скрываем индикаторы масштаба */
        #zoom-indicator,
        .zoom-controls,
        .zoom-notification {
            display: none !important;
        }

        /* Убираем глобальное масштабирование */
        html {
            transform: none !important;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <h2>🔐 Вход для администратора</h2>
            <p>Введите логин и пароль</p>
        </div>
        
        <div class="error-message" id="errorMessage">
            Неверный логин или пароль. Попробуйте снова.
        </div>
        
        <div class="success-message" id="successMessage">
            Успешный вход! Перенаправление...
        </div>
        
        <form class="auth-form" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
            <div class="form-group">
                <label for="login">Логин</label>
                <input type="text" class="form-control" id="login" name="login" placeholder="Введите логин" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <div class="password-wrapper">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Введите пароль" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility()">👁️</span>
                </div>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="rememberMe" name="rememberMe">
                <label for="rememberMe">Запомнить меня</label>
            </div>
            
            <button type="submit" class="btn-auth" id="submitBtn">Войти</button>
        </form>
        
        <div class="auth-footer">
            <a href="index.html">← Вернуться на главную</a>
        </div>
    </div>

    <script>
        // Данные из файла Админ.xlsx (встроены в код)
        const ADMIN_CREDENTIALS = [
            { login: "Kristina", password: "123456" }
        ];

        // Проверяем сохраненную сессию при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            const savedSession = localStorage.getItem('admin_session');
            if (savedSession) {
                try {
                    const session = JSON.parse(savedSession);
                    const now = new Date().getTime();
                    
                    // Проверяем, не истекла ли сессия (30 дней)
                    if (now - session.timestamp < 30 * 24 * 60 * 60 * 1000) {
                        // Автоматический вход
                        sessionStorage.setItem('admin_authenticated', 'true');
                        window.location.href = 'admin-panel.html';
                    } else {
                        // Сессия истекла - удаляем
                        localStorage.removeItem('admin_session');
                    }
                } catch (e) {
                    localStorage.removeItem('admin_session');
                }
            }
        });

        // Переключает видимость пароля
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            const toggleIcon = document.querySelector('.toggle-password');
            toggleIcon.textContent = type === 'password' ? '👁️' : '🔒';
        }

        // Показывает сообщение об ошибке
        function showError(show = true, message = 'Неверный логин или пароль. Попробуйте снова.') {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            if (show) {
                errorDiv.classList.add('show');
            } else {
                errorDiv.classList.remove('show');
            }
        }

        // Показывает сообщение об успешном входе
        function showSuccess(show = true) {
            const successDiv = document.getElementById('successMessage');
            if (show) {
                successDiv.classList.add('show');
            } else {
                successDiv.classList.remove('show');
            }
        }

        // Обработка логина
        function handleLogin() {
            const login = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;
            
            showError(false);
            
            if (!login || !password) {
                showError(true, 'Пожалуйста, заполните все поля.');
                return;
            }
            
            // Ищем пользователя
            const foundUser = ADMIN_CREDENTIALS.find(user => 
                user.login.toLowerCase() === login.toLowerCase() && user.password === password
            );
            
            if (foundUser) {
                showSuccess(true);
                
                // Сохраняем сессию в sessionStorage (на время сессии браузера)
                sessionStorage.setItem('admin_authenticated', 'true');
                
                // Если нажата "Запомнить меня", сохраняем в localStorage
                if (rememberMe) {
                    const sessionData = {
                        login: login,
                        timestamp: new Date().getTime()
                    };
                    localStorage.setItem('admin_session', JSON.stringify(sessionData));
                } else {
                    // Удаляем сохраненную сессию, если она была
                    localStorage.removeItem('admin_session');
                }
                
                setTimeout(() => {
                    window.location.href = 'admin-panel.html';
                }, 2000);
            } else {
                showError(true, 'Неверный логин или пароль.');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('#login, #password');
            inputs.forEach(input => {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleLogin();
                    }
                });
            });
        });
    </script>
    <!-- Скрипт для автоматической подгонки ширины страницы -->
    <script src="js/layout-fixer.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход для администратора - ИНДИГРА</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="css/custom.css" />
    <link rel="stylesheet" href="css/common.css" />
    <!-- Подключаем библиотеку для чтения Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        /* Стили для страницы авторизации */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            /* Убираем масштабирование */
            transform: none !important;
        }

        .auth-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            /* Убираем наследование масштаба */
            transform: none !important;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h2 {
            color: #1e3a8a;
            font-weight: 700;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }

        .auth-header p {
            color: #6c757d;
            font-size: 1rem;
        }

        .auth-form .form-group {
            margin-bottom: 1.5rem;
        }

        .auth-form label {
            color: #1e3a8a;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
            font-size: 1rem;
        }

        .auth-form .form-control {
            border: 2px solid #dbeafe;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
            background: #ffffff;
            font-size: 1rem;
            width: 100%;
        }

        .auth-form .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.25);
            outline: none;
        }

        .auth-form .btn-auth {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 10px;
            width: 100%;
            border: none;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .auth-form .btn-auth:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .auth-form .btn-auth:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
        }

        .auth-footer a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
        }

        .auth-footer a:hover {
            color: #1e3a8a;
            text-decoration: underline;
        }

        .error-message {
            background-color: #fee;
            color: #c33;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
            border: 1px solid #fcc;
            display: none;
            font-size: 1rem;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
            border: 1px solid #a5d6a7;
            display: none;
            font-size: 1rem;
        }

        .success-message.show {
            display: block;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #9ca3af;
            user-select: none;
            font-size: 1.2rem;
        }

        .toggle-password:hover {
            color: #1e3a8a;
        }

        /* Скрываем индикаторы масштаба */
        #zoom-indicator,
        .zoom-controls,
        .zoom-notification {
            display: none !important;
        }

        /* Убираем глобальное масштабирование */
        html {
            transform: none !important;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <h2>🔐 Вход для администратора</h2>
            <p>Введите логин и пароль</p>
        </div>
        
        <div class="error-message" id="errorMessage">
            Неверный логин или пароль. Попробуйте снова.
        </div>
        
        <div class="success-message" id="successMessage">
            Успешный вход! Перенаправление...
        </div>
        
        <form class="auth-form" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
            <div class="form-group">
                <label for="login">Логин</label>
                <input type="text" class="form-control" id="login" name="login" placeholder="Введите логин" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <div class="password-wrapper">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Введите пароль" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility()">👁️</span>
                </div>
            </div>
            
            <button type="submit" class="btn-auth" id="submitBtn">Войти</button>
        </form>
        
        <div class="auth-footer">
            <a href="index.html">← Вернуться на главную</a>
        </div>
    </div>

    <script>
        // Данные из файла Админ.xlsx (встроены в код)
        const ADMIN_CREDENTIALS = [
            { login: "Kristina", password: "123456" }
        ];

        // Переключает видимость пароля
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            const toggleIcon = document.querySelector('.toggle-password');
            toggleIcon.textContent = type === 'password' ? '👁️' : '🔒';
        }

        // Показывает сообщение об ошибке
        function showError(show = true, message = 'Неверный логин или пароль. Попробуйте снова.') {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            if (show) {
                errorDiv.classList.add('show');
            } else {
                errorDiv.classList.remove('show');
            }
        }

        // Показывает сообщение об успешном входе
        function showSuccess(show = true) {
            const successDiv = document.getElementById('successMessage');
            if (show) {
                successDiv.classList.add('show');
            } else {
                successDiv.classList.remove('show');
            }
        }

        // Блокирует форму на время обработки
        function setFormDisabled(disabled) {
            const loginInput = document.getElementById('login');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submitBtn');
            
            loginInput.disabled = disabled;
            passwordInput.disabled = disabled;
            submitBtn.disabled = disabled;
        }

        // Обработка логина
        function handleLogin() {
            const login = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value.trim();
            
            showError(false);
            
            if (!login || !password) {
                showError(true, 'Пожалуйста, заполните все поля.');
                return;
            }
            
            // Ищем пользователя
            const foundUser = ADMIN_CREDENTIALS.find(user => 
                user.login.toLowerCase() === login.toLowerCase() && user.password === password
            );
            
            setFormDisabled(true);
            
            setTimeout(() => {
                if (foundUser) {
                    showSuccess(true);
                    
                    try {
                        sessionStorage.setItem('admin_authenticated', 'true');
                        sessionStorage.setItem('admin_login', foundUser.login);
                        sessionStorage.setItem('admin_login_time', new Date().toISOString());
                    } catch (e) {
                        console.warn('Не удалось сохранить сессию:', e);
                    }
                    
                    setTimeout(() => {
                        window.location.href = 'admin-panel.html';
                    }, 2000);
                } else {
                    showError(true, 'Неверный логин или пароль.');
                    setFormDisabled(false);
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            }, 800);
        }

        // Проверка существующей сессии
        function checkExistingSession() {
            try {
                const isAuthenticated = sessionStorage.getItem('admin_authenticated') === 'true';
                const loginTime = sessionStorage.getItem('admin_login_time');
                
                if (isAuthenticated && loginTime) {
                    const timeSinceLogin = new Date() - new Date(loginTime);
                    const sessionTimeout = 30 * 60 * 1000;
                    
                    if (timeSinceLogin < sessionTimeout) {
                        window.location.href = 'admin-panel.html';
                    } else {
                        sessionStorage.removeItem('admin_authenticated');
                        sessionStorage.removeItem('admin_login');
                        sessionStorage.removeItem('admin_login_time');
                    }
                }
            } catch (e) {
                console.warn('Не удалось проверить сессию:', e);
            }
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            checkExistingSession();
            
            const inputs = document.querySelectorAll('#login, #password');
            inputs.forEach(input => {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleLogin();
                    }
                });
            });
        });
    </script>
</body>
</html>
